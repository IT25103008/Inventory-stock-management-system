<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Papol | Inventory and Stock Management System</title>
<meta name="description" content="Sign in to the Papol inventory and stock management workspace.">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<a href="login.html" class="brand" aria-label="Papol home">
  <svg class="brand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#fff" stroke-width="2.5" fill="none">
      <ellipse cx="50" cy="62" rx="22" ry="28" fill="#fff" stroke="none"/>
      <ellipse cx="50" cy="62" rx="22" ry="28"/>
      <path d="M50 34 C50 20,38 10,32 6" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M50 34 C50 18,56 8,60 4" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M50 34 C48 22,42 16,36 14" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 34 C52 22,58 14,64 12" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 34 C50 24,50 16,50 8" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="50" x2="66" y2="50" stroke-width="1.5" opacity=".4"/>
      <line x1="32" y1="62" x2="68" y2="62" stroke-width="1.5" opacity=".4"/>
      <line x1="34" y1="74" x2="66" y2="74" stroke-width="1.5" opacity=".4"/>
      <path d="M40 42 Q50 48 60 42" stroke-width="1.5" opacity=".3"/>
      <path d="M38 54 Q50 60 62 54" stroke-width="1.5" opacity=".3"/>
      <path d="M38 66 Q50 72 62 66" stroke-width="1.5" opacity=".3"/>
      <path d="M40 78 Q50 84 60 78" stroke-width="1.5" opacity=".3"/>
    </g>
  </svg>
  <div class="brand-text">
    <span class="brand-name">Papol</span>
    <span class="brand-sub">Inventory and Stock Management</span>
  </div>
</a>

<div class="page">
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="page-grid"></div>

  <section class="card">
    <div class="card-header">
      <h1>Welcome back</h1>
      <p>Sign in to your Papol inventory workspace.</p>
    </div>

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      <span class="material-symbols-outlined field-icon" id="togglePwd">visibility</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button type="button" class="btn btn-primary" onclick="doLogin()">
      <span class="material-symbols-outlined">login</span>
      Sign in
    </button>
  </section>
</div>

<script src="../js/auth.js"></script>
</body>
</html>
